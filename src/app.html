<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			/* FOUC firewall: resolve theme (explicit override or system
			 * preference) and set the data-theme attribute on <html>
			 * before first paint, so the matching token block is in
			 * effect when the page renders. Setting data-theme
			 * unconditionally (rather than only on explicit override)
			 * lets app.css keep a single dark-mode token rule instead
			 * of duplicating the block across `[data-theme='dark']`
			 * and `@media (prefers-color-scheme: dark)`. */
			(function () {
				var t = null;
				try {
					t = localStorage.getItem('kemek-qr:theme');
				} catch (e) {}
				var resolved =
					t === 'dark' || t === 'light'
						? t
						: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-theme', resolved);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
