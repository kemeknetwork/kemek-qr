<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 128" width="480" height="128" role="img" aria-label="kemek/qr lockup">
	<title>kemek-qr horizontal lockup — mark + wordmark, for light surfaces</title>
	<!-- Canonical mark — bare 7×7 grid, accent red. No frame, no
	     background. Same shape definition as src/routes/+layout.svelte's
	     `.brand-mark` SVG (the masthead). Scaled to 96 px tall and
	     left-aligned with 16 px top margin. -->
	<g transform="translate(16 16) scale(13.71)" fill="#c53a1f">
		<path d="M0 0h3v1H0zM0 2h3v1H0zM0 1h1v1H0zM2 1h1v1H2z" />
		<path d="M4 0h3v1H4zM4 2h3v1H4zM4 1h1v1H4zM6 1h1v1H6z" />
		<path d="M0 4h3v1H0zM0 6h3v1H0zM0 5h1v1H0zM2 5h1v1H2z" />
		<rect x="4" y="4" width="1" height="1" />
		<rect x="6" y="4" width="1" height="1" />
		<rect x="5" y="5" width="1" height="1" />
		<rect x="4" y="6" width="1" height="1" />
		<rect x="6" y="6" width="1" height="1" />
	</g>
	<!-- Wordmark — "kemek/qr" in JetBrains Mono Bold. Falls back to a
	     generic monospace if the font isn't available; PNG rasters
	     are built with the font loaded so the canonical export is
	     locked. The "/" mirrors the in-app masthead treatment. -->
	<text x="136" y="86" font-family="'JetBrains Mono', 'JetBrainsMono', 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="60" font-weight="700" letter-spacing="-0.02em" fill="#0e0b06">
		kemek<tspan fill="#c53a1f">/</tspan>qr
	</text>
</svg>
