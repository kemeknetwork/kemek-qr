<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
	<defs>
		<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
			<circle cx="7" cy="7" r="1.4" fill="#f9eedb" opacity="0.04"/>
		</pattern>
	</defs>

	<!-- Graphite paper (the dark-mode paper token). Subtle cream dot
	     pattern for the same drafting-grid feel as light mode, dropped
	     to 4% opacity so it reads as paper texture, not as a grid. -->
	<rect width="1200" height="630" fill="#100e09"/>
	<rect width="1200" height="630" fill="url(#dots)"/>

	<!-- Inner frame — cream stroke at low opacity reads as a
	     specification border without competing with the type. -->
	<rect x="40" y="40" width="1120" height="550" fill="none" stroke="#f9eedb" stroke-opacity="0.34" stroke-width="1.5"/>

	<!-- Corner crop marks in accent red — the brand's signature
	     drafting-spec frame. Same proportions / placement as the
	     light variant. -->
	<g fill="#e0492c">
		<rect x="40" y="40" width="2" height="22"/>
		<rect x="40" y="40" width="22" height="2"/>
		<rect x="1158" y="40" width="2" height="22"/>
		<rect x="1138" y="40" width="22" height="2"/>
		<rect x="40" y="568" width="2" height="22"/>
		<rect x="40" y="588" width="22" height="2"/>
		<rect x="1158" y="568" width="2" height="22"/>
		<rect x="1138" y="588" width="22" height="2"/>
	</g>

	<!-- Brand lockup — canonical 7×7 mark + Fraunces wordmark. Mark
	     geometry copied verbatim from static/brand/mark-dark.svg with
	     the 1-unit padded viewBox (-1 -1 9 9 → scale(5) means 9*5=45
	     px tall, with 5-px padding inside that box on every side).
	     Slash uses the dark-mode accent #e0492c to match the rest of
	     the card; preferred font is Fraunces, Georgia is the
	     documented fallback for sharp+librsvg rasterization. -->
	<g transform="translate(75 75)">
		<g transform="translate(5 5) scale(5)" fill="#e0492c">
			<path d="M0 0h3v1H0zM0 2h3v1H0zM0 1h1v1H0zM2 1h1v1H2z"/>
			<path d="M4 0h3v1H4zM4 2h3v1H4zM4 1h1v1H4zM6 1h1v1H6z"/>
			<path d="M0 4h3v1H0zM0 6h3v1H0zM0 5h1v1H0zM2 5h1v1H2z"/>
			<rect x="4" y="4" width="1" height="1"/>
			<rect x="6" y="4" width="1" height="1"/>
			<rect x="5" y="5" width="1" height="1"/>
			<rect x="4" y="6" width="1" height="1"/>
			<rect x="6" y="6" width="1" height="1"/>
		</g>
		<text x="64" y="35" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="500" font-size="40" fill="#f9eedb" letter-spacing="-0.5">
			kemek<tspan fill="#e0492c">/</tspan>qr
		</text>
	</g>

	<text x="80" y="200" font-family="ui-monospace, 'Menlo', monospace" font-size="18" letter-spacing="6" fill="#e0492c" font-weight="500">PLATE 01 · KMK·QR</text>

	<text x="80" y="300" font-family="Georgia, serif" font-size="78" font-weight="400" fill="#f9eedb" letter-spacing="-2">
		<tspan>A QR code that</tspan>
	</text>
	<text x="80" y="380" font-family="Georgia, serif" font-style="italic" font-size="78" font-weight="400" fill="#e0492c" letter-spacing="-2">
		<tspan>doesn’t want anything</tspan>
	</text>
	<text x="80" y="455" font-family="Georgia, serif" font-style="italic" font-size="78" font-weight="400" fill="#e0492c" letter-spacing="-2">
		<tspan>from you.</tspan>
	</text>

	<text x="80" y="520" font-family="ui-monospace, 'Menlo', monospace" font-size="18" fill="#f9eedb" opacity="0.62" letter-spacing="2.5">
		<tspan>Free · No signup · No tracking · Logo + styling included.</tspan>
	</text>

	<!-- Bottom-of-page microcopy — bumped +1 (12 → 13) per user. -->
	<g transform="translate(80 555)" font-family="ui-monospace, 'Menlo', monospace" font-size="13" fill="#f9eedb" letter-spacing="3">
		<text opacity="0.55">PNG · SVG · PDF</text>
		<text x="215" opacity="0.55">CLIENT-SIDE</text>
		<text x="430" opacity="0.55">EDITION I — V·MMXXVI</text>
	</g>

	<!-- Specimen card on the right — warm graphite fill, cream stroke.
	     "01" plate number now centered horizontally within the 195-px
	     card column (was left-aligned in the rubric column, which felt
	     off-center). PLATE rubric stays anchored left as a column
	     label. Card rubrics bumped +1 (10/11 → 11/12). -->
	<g transform="translate(925 80)">
		<rect width="195" height="470" fill="#16130d" stroke="#f9eedb" stroke-opacity="0.34" stroke-width="1"/>

		<text x="20" y="50" font-family="ui-monospace, 'Menlo', monospace" font-size="12" letter-spacing="3" fill="#f9eedb" opacity="0.55">PLATE</text>
		<text x="97.5" y="115" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="76" fill="#e0492c" letter-spacing="-2">01</text>

		<line x1="0" y1="160" x2="195" y2="160" stroke="#f9eedb" stroke-width="1" opacity="0.2"/>

		<g transform="translate(105 195)" stroke="#f9eedb" fill="#f9eedb">
			<rect x="0" y="0" width="14" height="14"/>
			<rect x="20" y="0" width="14" height="14"/>
			<rect x="40" y="0" width="14" height="14"/>
			<rect x="60" y="0" width="14" height="14"/>
			<rect x="0" y="20" width="14" height="14"/>
			<rect x="40" y="20" width="14" height="14"/>
			<rect x="60" y="20" width="14" height="14"/>
			<rect x="0" y="40" width="14" height="14"/>
			<rect x="20" y="40" width="14" height="14"/>
			<rect x="40" y="40" width="14" height="14"/>
		</g>
		<g transform="translate(20 195)" stroke="#f9eedb" stroke-width="3" fill="none">
			<rect x="0" y="0" width="60" height="60"/>
			<rect x="15" y="15" width="30" height="30" fill="#f9eedb"/>
		</g>
		<g transform="translate(20 280)" stroke="#f9eedb" stroke-width="3" fill="none">
			<rect x="0" y="0" width="60" height="60"/>
			<rect x="15" y="15" width="30" height="30" fill="#f9eedb"/>
		</g>
		<g transform="translate(105 280)" fill="#f9eedb">
			<rect x="0" y="0" width="14" height="14"/>
			<rect x="40" y="0" width="14" height="14"/>
			<rect x="60" y="0" width="14" height="14"/>
			<rect x="0" y="20" width="14" height="14"/>
			<rect x="20" y="20" width="14" height="14"/>
			<rect x="40" y="20" width="14" height="14"/>
			<rect x="0" y="40" width="14" height="14"/>
			<rect x="40" y="40" width="14" height="14"/>
			<rect x="60" y="40" width="14" height="14"/>
		</g>
		<g transform="translate(20 365)" fill="#f9eedb">
			<rect x="0" y="0" width="14" height="14"/>
			<rect x="20" y="0" width="14" height="14"/>
			<rect x="60" y="0" width="14" height="14"/>
			<rect x="0" y="20" width="14" height="14"/>
			<rect x="20" y="20" width="14" height="14"/>
			<rect x="40" y="20" width="14" height="14"/>
			<rect x="0" y="40" width="14" height="14"/>
			<rect x="40" y="40" width="14" height="14"/>
			<rect x="60" y="40" width="14" height="14"/>
		</g>
		<g transform="translate(105 365)" stroke="#f9eedb" stroke-width="3" fill="none">
			<rect x="0" y="0" width="60" height="60"/>
			<rect x="15" y="15" width="30" height="30" fill="#f9eedb"/>
		</g>

		<line x1="0" y1="442" x2="195" y2="442" stroke="#f9eedb" stroke-width="1" opacity="0.2"/>
		<text x="20" y="462" font-family="ui-monospace, 'Menlo', monospace" font-size="11" letter-spacing="3" fill="#f9eedb" opacity="0.55">SCAN ME</text>
	</g>
</svg>
