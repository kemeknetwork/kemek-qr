	<!-- Canonical 7×7 mark — same geometry as src/routes/+layout.svelte's
	     `.brand-mark` and static/favicon.svg. Three finder-pattern
	     eyes (TL/TR/BL) + quincunx data cells in the BR quadrant.
	     Scaled to 28×28 (4 px per grid cell) so the silhouette
	     reads at OG-card resolution. -->
	<g transform="translate(80 80)">
		<g transform="scale(4)" fill="#c53a1f">
			<path d="M0 0h3v1H0zM0 2h3v1H0zM0 1h1v1H0zM2 1h1v1H2z"/>
