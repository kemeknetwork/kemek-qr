<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
	<!-- Maskable icon: Android adaptive-icon mask spec reserves the
	     central 80% circle as the "safe zone" — anything outside may
	     be cropped to the device-chosen mask shape. The paper fill
	     covers the entire 100% canvas (no outer stroke; an outer line
	     would get clipped). The brand mark is centered at ~56% of the
	     canvas, well within the safe zone, matching favicon.svg's
	     finder + data cells exactly so the maskable read identically
	     to the standard favicon when the mask is a square. -->
	<rect width="100" height="100" fill="#100e09"/>
	<g transform="translate(22 22)" fill="#e0492c">
		<!-- 7×7 grid scaled to 56 px (8 px cells). Identical layout
		     to favicon.svg, just rebased on the maskable canvas. -->
		<!-- TL finder -->
		<rect width="24" height="8"/>
		<rect y="16" width="24" height="8"/>
		<rect y="8" width="8" height="8"/>
		<rect x="16" y="8" width="8" height="8"/>
		<!-- TR finder -->
		<rect x="32" width="24" height="8"/>
		<rect x="32" y="16" width="24" height="8"/>
		<rect x="32" y="8" width="8" height="8"/>
		<rect x="48" y="8" width="8" height="8"/>
		<!-- BL finder -->
		<rect y="32" width="24" height="8"/>
		<rect y="48" width="24" height="8"/>
		<rect y="40" width="8" height="8"/>
		<rect x="16" y="40" width="8" height="8"/>
		<!-- Data cells in BR quadrant -->
		<rect x="32" y="32" width="8" height="8"/>
		<rect x="48" y="32" width="8" height="8"/>
		<rect x="40" y="40" width="8" height="8"/>
		<rect x="32" y="48" width="8" height="8"/>
		<rect x="48" y="48" width="8" height="8"/>
	</g>
</svg>
